<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today — Qadam</title>
    <link rel="icon" href="images/qadam-favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Icons for the sidebar-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--Unbounded for headings, Manrope for text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/today.css">
</head>

<body class="app today-page">

    <!--Sidebar (same on every app page)-->
    <header class="sidebar">
        <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
            <a class="navbar-brand brand" href="index.html">
                <img src="images/qadam-mark.svg" alt="" class="brand-logo" width="28" height="28">Qadam
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNav"
                aria-controls="appNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="appNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house" aria-hidden="true"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="today.html"><i class="bi bi-check2-square"
                                aria-hidden="true"></i>Today</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html"><i class="bi bi-calendar3"
                                aria-hidden="true"></i>Calendar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="habits.html"><i class="bi bi-fire" aria-hidden="true"></i>Habits</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="focus.html"><i class="bi bi-stopwatch"
                                aria-hidden="true"></i>Focus</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="countdown.html"><i class="bi bi-hourglass-split"
                                aria-hidden="true"></i>Countdown</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!--Page content-->
    <main class="app-main">
        <header class="page-header">
            <h1 class="page-title">Today</h1>
            <p class="page-subtitle">
                <time datetime="2026-09-30">Wednesday, 30 September</time> · 5 tasks and 2 habits left.
            </p>
        </header>

        <div class="row g-4">
            <!--Left column: task lists-->
            <div class="col-lg-8">
                <section class="panel today-group mb-4" aria-labelledby="today-overdue-title">
                    <h2 id="today-overdue-title" class="h5">Overdue</h2>
                </section>

                <section class="panel today-group mb-4" aria-labelledby="today-tasks-title">
                    <h2 id="today-tasks-title" class="h5">Today</h2>
                </section>

                <section class="panel today-group mb-4" aria-labelledby="today-habits-title">
                    <h2 id="today-habits-title" class="h5">Today's habits</h2>
                </section>

                <section class="panel today-group" aria-labelledby="today-done-title">
                    <h2 id="today-done-title" class="h5">Completed</h2>
                </section>
            </div>

            <!--Right column: new task form-->
            <aside class="col-lg-4" aria-label="Add a task">
            </aside>
        </div>

        <footer class="app-footer">
            <p class="mb-0">&copy; 2026 Qadam. Midterm project, Web Technologies 1.</p>
        </footer>
    </main>

    <!--needed for the burger menu on small screens-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
